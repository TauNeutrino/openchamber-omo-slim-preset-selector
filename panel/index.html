<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Omo Preset</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: transparent;
        color: var(--oc-fg, #ddd);
        font-family: var(--oc-font, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; }
      [hidden] { display: none !important; }
      :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--oc-focus, #6aa9ff); }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 10px 12px 12px;
        min-width: 0;
      }
      .icon-btn {
        flex: none;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--oc-muted, #999);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .icon-btn:hover:not(:disabled) { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); color: var(--oc-fg, #ddd); }
      .icon-btn:disabled { opacity: 0.5; cursor: default; }

      .active-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .active-row .preset-trigger { width: auto; flex: 1 1 auto; min-width: 0; }
      .active-row .icon-btn { flex: none; }
      .preset-trigger {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid transparent;
        border-radius: calc(var(--oc-radius, 8px) * 0.75);
        background: transparent;
        text-align: start;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease;
      }
      .preset-trigger:hover:not(:disabled) { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .preset-trigger[aria-expanded="true"] {
        background: var(--oc-hover, rgba(127, 127, 127, 0.15));
        border-color: var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .preset-trigger:disabled { opacity: 0.5; cursor: default; }
      .preset-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
      }
      .chevron {
        flex: none;
        color: var(--oc-muted, #999);
        font-size: 10px;
        line-height: 1;
        width: 10px;
        text-align: center;
      }

      .preset-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 3px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.75);
        background: var(--oc-elevated, rgba(127, 127, 127, 0.06));
      }
      .preset-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
        padding: 5px 7px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: start;
        cursor: pointer;
      }
      .preset-option:hover:not(:disabled),
      .preset-option:focus-visible { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); box-shadow: none; }
      .preset-option[data-active="true"] {
        background: var(--oc-selection, rgba(120, 160, 255, 0.2));
        color: var(--oc-selection-fg, inherit);
      }
      .preset-option:disabled { opacity: 0.5; cursor: default; }
      .option-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
      .option-name { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .option-model {
        font: 10.5px/1.35 var(--oc-mono, ui-monospace, monospace);
        color: var(--oc-muted, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preset-option[data-active="true"] .option-model { color: inherit; opacity: 0.75; }
      .option-check { flex: none; font-size: 11px; color: var(--oc-info, #3fa9f5); }
      .preset-option[data-active="true"] .option-check { color: inherit; }

      /* Agent list: a two-column shared grid. The name column sizes to the
         widest disclosure; the model column gets the rest and is read as a
         single left-aligned line. Model IDs therefore start on the same
         x-position across every row. */
      .agents {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 12px;
        row-gap: 2px;
        align-items: baseline;
        padding-top: 1px;
        container-type: inline-size;
        container-name: agents;
      }
      .agents-empty { grid-column: 1 / -1; font-size: 11px; color: var(--oc-muted, #999); }
      .model-picker { margin-top: 8px; padding: 6px 8px; border: 1px solid var(--oc-border, rgba(127,127,127,0.28)); border-radius: 6px; background: var(--oc-card, rgba(127,127,127,0.06)); font-size: 11px; max-height: 220px; display: flex; flex-direction: column; }
      .picker-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
      .picker-title { font-weight: 600; color: var(--oc-fg, #ddd); }
      .picker-filter { font-size: 10px; color: var(--oc-muted, #999); margin-bottom: 4px; }
      .picker-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0; flex: 1 1 auto; min-height: 0; scrollbar-gutter: stable; }
      .picker-option { text-align: left; border: 0; background: transparent; color: var(--oc-fg, #ddd); padding: 1px 6px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono, monospace); font-size: 11px; flex: 1 1 auto; min-width: 0; overflow: hidden; box-sizing: border-box; display: flex; align-items: center; }
      .picker-option-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; unicode-bidi: isolate; text-align: right; }
      .picker-option:hover { background: var(--oc-hover, rgba(127,127,127,0.15)); }
      .picker-option.is-current { color: var(--oc-info, #4a9eff); font-weight: 600; }
      .picker-empty { color: var(--oc-muted, #999); font-size: 11px; padding: 4px 6px; }
      .agent-model.is-editable:hover { background: var(--oc-hover, rgba(127,127,127,0.15)); border-radius: 4px; }
      .agent-model.is-editable { cursor: pointer; }
      .origin-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        background: var(--oc-hover, rgba(127, 127, 127, 0.15));
        color: var(--oc-muted, #999);
        pointer-events: none;
      }
      .clone-btn { border: 0; background: transparent; color: var(--oc-muted, #999); cursor: pointer; font-size: 12px; padding: 0 2px; flex-shrink: 0; }
      .clone-btn:hover { color: var(--oc-fg, #ddd); }
      .origin-badge.is-project {
        background: color-mix(in srgb, var(--oc-info, #4a9eff) 18%, transparent);
        color: var(--oc-info, #4a9eff);
      }
      .picker-row { display: flex; align-items: center; gap: 4px; flex-shrink: 0; flex-wrap: nowrap; }
      .picker-row.is-current-row { background: var(--oc-hover, rgba(127,127,127,0.08)); border-radius: 4px; }
      .picker-variants { display: inline-flex; gap: 2px; flex-wrap: nowrap; flex: 0 0 auto; overflow-x: auto; scrollbar-width: none; }
      .picker-variants::-webkit-scrollbar { display: none; }
      .variant-pill { border: 1px solid var(--oc-border, rgba(127,127,127,0.28)); background: transparent; color: var(--oc-muted, #999); padding: 0 2px; border-radius: 999px; font-size: 8px; cursor: pointer; line-height: 1.4; }
      .variant-pill:hover { color: var(--oc-fg, #ddd); border-color: var(--oc-fg, #ddd); }
      .variant-pill.is-active { background: var(--oc-info, #4a9eff); color: #fff; border-color: var(--oc-info, #4a9eff); }
      .variant-input { width: 64px; padding: 0 4px; border: 1px solid var(--oc-border, rgba(127,127,127,0.28)); border-radius: 999px; background: transparent; color: var(--oc-muted, #999); font-size: 8px; line-height: 1.4; }
      .settings-box {
        margin-top: 6px;
        padding: 6px 8px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 6px;
        background: var(--oc-card, rgba(127, 127, 127, 0.06));
        font-size: 11px;
      }
      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
      .setting-label { color: var(--oc-muted, #999); }
      .setting-input { width: 60px; padding: 2px 4px; border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28)); border-radius: 4px; background: transparent; color: var(--oc-fg, #ddd); font-size: 11px; }
      .agent-group, .agent { display: contents; }
      .agent-disclosure { grid-column: 1; }
      .agent-name { grid-column: 1; }
      .agent-model { grid-column: 2; }
      .agent-name {
        min-width: 0;
        max-width: 14ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--oc-muted, #999);
      }
      .agent-disclosure {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        min-height: 24px;
        margin: -2px 0 -2px -4px;
        padding: 2px 4px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .agent-disclosure:hover, .agent-disclosure[aria-expanded="true"] { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .agent-disclosure .agent-name { max-width: 14ch; }
      .session-count { flex: none; color: var(--oc-info, #3fa9f5); font-size: 12.5px; line-height: 1; }
      /* Fertige Sessions: Ziffer im Quadrat — Unicode kennt keine, also zeichnet
         CSS den Rahmen (flexibles Rundeck statt Emoji-Keycaps). */
      .session-count.is-done {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 13px;
        height: 13px;
        padding: 0 2px;
        border: 1px solid var(--oc-success, #a6e3a1);
        border-radius: 3.5px;
        color: var(--oc-success, #a6e3a1);
        font: 9.5px/1 var(--oc-mono, ui-monospace, monospace);
      }
      .session-count sup { font-size: 9px; }
      .agent-chevron { flex: none; color: var(--oc-muted, #999); font-size: 9px; }
      /* Model line: only the model id is visible; the full provider/id chain
         lives in .agent-model's title. The content flexes and truncates; pills
         sit at the end and never push the id to a different start position. */
      .agent-model {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: 5px;
        min-width: 0;
        font: 11px/1.4 var(--oc-mono, ui-monospace, monospace);
      }
      .model-text {
        display: flex;
        align-items: baseline;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
      }
      .model-content { flex: 0 0 auto; white-space: nowrap; }
      .model-text .model-content {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .model-content.is-inherited {
        color: var(--oc-muted, #999);
        font-style: italic;
      }
      .agent-pills {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 3px;
        flex: 0 0 auto;
        min-width: 0;
      }
      .variant {
        flex: 0 0 auto;
        padding: 0 4px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 999px;
        color: var(--oc-muted, #999);
        font: 9px/1.5 var(--oc-mono, ui-monospace, monospace);
        white-space: nowrap;
        max-width: 12ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Number of models the agent falls back to; dashed to read as a count,
         not as another model id. */
      .variant.fallback-count {
        padding: 0 3px;
        border-style: dashed;
        font-size: 8px;
      }
      /* Zero fallbacks still occupy the column, but stay out of the way. */
      .variant.fallback-count.is-zero {
        opacity: 0.5;
      }
      /* Session-Baum: eingerückt unter dem Agenten, keine eigene Box,
         Schriftgröße maximal auf Höhe des Agenten-Texts. */
      .session-list {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 220px;
        overflow-y: auto;
        margin: 0 0 4px 6px;
        padding: 0 0 0 10px;
        border-left: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .session-option {
        display: flex;
        align-items: baseline;
        gap: 5px;
        min-width: 0;
      }
      .session-option.is-done .session-title { color: var(--oc-muted, #999); }
      .session-open {
        display: flex;
        align-items: baseline;
        gap: 5px;
        flex: 1 1 auto;
        min-width: 0;
        padding: 1px 4px;
        border: 0;
        border-radius: 4px;
        background: none;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      .session-open:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .session-activity { flex: none; color: var(--oc-muted, #999); font-size: 10px; }
      .session-activity.is-live { color: var(--oc-info, #3fa9f5); font-variant-numeric: tabular-nums; min-width: 3.5ch; text-align: right; }
      .session-hide {
        flex: none;
        display: inline-flex;
        align-items: center;
        padding: 1px 4px;
        border: 0;
        border-radius: 4px;
        background: none;
        cursor: pointer;
        color: var(--oc-muted, #999);
        font-size: 9px;
        line-height: 1;
      }
      .session-hide:hover { color: var(--oc-fg, #ddd); background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }

      @container agents (max-width: 289px) {
        .agent-name { max-width: 12ch; }
        .agent-disclosure .agent-name { max-width: 12ch; }
        .variant { padding: 0 3px; font-size: 8px; }
        .variant.fallback-count { font-size: 7px; }
      }

      .tree-section {
        min-width: 0;
        padding-top: 5px;
        border-top: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .tree-section-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 24px;
        padding: 3px 4px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 11px;
        text-align: left;
        cursor: pointer;
      }
      .tree-section-trigger:hover, .tree-section-trigger[aria-expanded="true"] { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-list, .tree-children { list-style: none; padding: 0; }
      .tree-list { max-height: 240px; overflow: auto; margin: 3px 0 0; }
      .tree-children { margin: 0 0 0 12px; padding-left: 4px; border-left: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28)); }
      .tree-children.is-deep { margin-left: 0; padding-left: 0; border-left: 0; }
      .tree-item { min-width: 0; }
      .tree-row { display: flex; align-items: flex-start; min-width: 0; }
      .tree-disclosure, .tree-disclosure-spacer {
        flex: none;
        width: 22px;
        height: 24px;
      }
      .tree-disclosure {
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 10px;
        cursor: pointer;
      }
      .tree-disclosure:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-session {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        align-items: stretch;
        min-width: 0;
        min-height: 24px;
        padding: 4px 5px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .tree-session:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-headline { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
      .tree-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
      .tree-child-count { flex: none; color: var(--oc-muted, #999); font-size: 10px; }
      .tree-details { display: flex; flex-wrap: wrap; gap: 1px 6px; min-width: 0; color: var(--oc-muted, #999); font-size: 10px; line-height: 1.4; }
      .tree-state, .tree-outcome { flex: none; }
      .tree-state.is-live { color: var(--oc-info, #3fa9f5); }
      .tree-metadata { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--oc-mono, ui-monospace, monospace); }

      /* Model availability: missing refs stand out on the agent row and in the check line. */
      .agent-group.is-missing .model-text > .model-content { color: var(--oc-destructive, #f38ba8); }
      .agent-group.is-missing .agent-disclosure .agent-name { color: var(--oc-destructive, #f38ba8); }
      .agent-group.is-missing .agent-name { color: var(--oc-destructive, #f38ba8); }
      .confirm {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.9);
        background: var(--oc-muted-surface, rgba(127, 127, 127, 0.08));
      }
      .confirm-title { font-size: 13px; font-weight: 600; }
      .confirm-body { font-size: 11.5px; line-height: 1.5; color: var(--oc-muted, #999); overflow-wrap: anywhere; }
      .confirm-body code {
        padding: 0 3px;
        border-radius: 3px;
        background: var(--oc-bg, transparent);
        color: var(--oc-fg, #ddd);
        font: 10.5px var(--oc-mono, ui-monospace, monospace);
      }
      .confirm-hint { font-size: 11px; line-height: 1.45; color: var(--oc-info-text, var(--oc-muted, #999)); }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 6px; }
      .clone-box { gap: 10px; }
      .clone-scope { display: flex; gap: 6px; }
      .clone-scope-btn {
        flex: 1 1 0;
        padding: 6px 8px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: transparent;
        color: var(--oc-fg, #ddd);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }
      .clone-scope-btn:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .clone-field { display: flex; flex-direction: column; gap: 4px; }
      .clone-label { font-size: 11px; color: var(--oc-muted, #999); }
      .clone-input {
        padding: 6px 8px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: transparent;
        color: var(--oc-fg, #ddd);
        font-size: 12px;
      }
      .confirm-cancel {
        padding: 6px 10px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: transparent;
        color: var(--oc-muted, #999);
        cursor: pointer;
        font-size: 12px;
      }
      .confirm-apply {
        padding: 6px 12px;
        border: 0;
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: var(--oc-primary, #4a9eff);
        color: var(--oc-primary-foreground, #fff);
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .confirm-apply:hover { filter: brightness(1.1); }

      .loading { padding: 8px 2px; }

      /* Scope indicator in the active-row trigger. */
      .scope-control {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
        flex: none;
        margin-left: auto;
        text-align: right;
      }
      .scope-hint {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        max-width: 110px;
        font-size: 9.5px;
        line-height: 1.2;
        color: var(--oc-muted, #999);
      }
      .scope-hint-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .clear-override {
        color: var(--oc-muted, #999);
      }
      .clear-override:hover:not(:disabled) {
        color: var(--oc-destructive, #f38ba8);
        background: var(--oc-hover, rgba(127, 127, 127, 0.15));
      }

      /* Confirm card: segmented scope switch, notes and override warning. */
      .confirm-scope {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .scope-choice {
        flex: 1 1 0;
        min-width: 0;
        padding: 5px 6px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: transparent;
        color: var(--oc-fg, #ddd);
        font-size: 11.5px;
        font-weight: 500;
        text-align: center;
        cursor: pointer;
      }
      .scope-choice:hover:not(:disabled):not(.is-selected) {
        background: var(--oc-hover, rgba(127, 127, 127, 0.15));
      }
      .scope-choice.is-selected {
        border-color: var(--oc-primary, #4a9eff);
        background: var(--oc-primary, #4a9eff);
        color: var(--oc-primary-foreground, #fff);
      }
      .scope-choice:disabled,
      .scope-choice.is-disabled {
        opacity: 0.45;
        cursor: default;
      }
      .confirm-scope-note {
        flex-basis: 100%;
        margin: 0;
        font-size: 10.5px;

      .agent-editor .confirm-warning { margin-top: 2px; }

      .editor-section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .editor-section-title {

        justify-content: center;
        padding: 0;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 4px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;

      .chain-btn:hover:not(:disabled) { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); color: var(--oc-fg, #ddd); }

      .chain-btn.is-remove:hover { color: var(--oc-destructive, #f38ba8); border-color: var(--oc-destructive, #f38ba8); background: color-mix(in srgb, var(--oc-destructive, #f38ba8) 12%, transparent); }
      .chain-add {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
        padding: 3px 8px;
        border: 1px dashed var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 11px;
        cursor: pointer;

      .chain-add:hover { color: var(--oc-fg, #ddd); border-color: var(--oc-fg, #ddd); background: var(--oc-hover, rgba(127, 127, 127, 0.12)); }

      .agent-editor .model-picker.editor-picker {
        margin-top: 4px;
        max-height: 160px;

      .editor-advanced { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .editor-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .editor-field.is-row { flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }
      .editor-label { font-size: 10.5px; color: var(--oc-muted, #999); }
      .editor-input,
      .editor-select,
      .editor-textarea {
        width: 100%;
        padding: 4px 6px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 5px;
        background: transparent;
        color: var(--oc-fg, #ddd);
        font-size: 11px;
        line-height: 1.4;
      }
      .editor-input::placeholder,
      .editor-textarea::placeholder { color: var(--oc-muted, #999); }
      .editor-select { width: auto; min-width: 120px; }
      .editor-textarea { min-height: 54px; resize: vertical; font-family: var(--oc-mono, ui-monospace, monospace); }
      .editor-help { font-size: 10px; color: var(--oc-muted, #999); line-height: 1.35; }
      .editor-checkbox-row {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        font-size: 11px;
        color: var(--oc-fg, #ddd);
        cursor: pointer;
      }
      .editor-checkbox-row input { flex: none; margin-top: 1px; }

      .editor-perm { display: flex; flex-direction: column; gap: 6px; }
      .editor-perm-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .editor-json-btn {
        padding: 3px 7px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 10.5px;
        cursor: pointer;
      }
      .editor-json-btn:hover { color: var(--oc-fg, #ddd); background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }

      .editor-footer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        padding-top: 4px;
        border-top: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .editor-actions { display: flex; justify-content: flex-end; gap: 6px; }
      .editor-cancel {
        padding: 6px 10px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 12px;
        cursor: pointer;
      }
      .editor-cancel:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); color: var(--oc-fg, #ddd); }
      .editor-save {
        padding: 6px 12px;
        border: 0;
        border-radius: calc(var(--oc-radius, 8px) * 0.7);
        background: var(--oc-primary, #4a9eff);
        color: var(--oc-primary-foreground, #fff);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .editor-save:hover { filter: brightness(1.1); }
      .editor-remove-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .editor-remove {
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        background: transparent;
        color: var(--oc-destructive, #f38ba8);
        font-size: 11px;
        cursor: pointer;
      }
      .editor-remove:hover { background: color-mix(in srgb, var(--oc-destructive, #f38ba8) 12%, transparent); }
      .editor-remove-confirm {
        padding: 5px 10px;
        border: 0;
        border-radius: 5px;
        background: var(--oc-destructive, #f38ba8);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .editor-remove-cancel {
        padding: 5px 10px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));

        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 11px;
        cursor: pointer;
      }

      /* Status surface: keep the editor short */
      .status-surface .agent-editor { gap: 6px; padding: 6px 8px; }

      .status-surface .chain-list { max-height: 110px; }
      .status-surface .model-picker.editor-picker { max-height: 120px; }

      @media (prefers-reduced-motion: reduce) {

      }
    </style>
